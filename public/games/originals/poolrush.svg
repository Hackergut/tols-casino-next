<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
  <title id="title">Pool Rush Fast Break</title><desc id="desc">A neon pool table with a cue ball breaking a rack.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071712"/><stop offset="1" stop-color="#0b0c12"/></linearGradient>
    <linearGradient id="felt" x2="1" y2="1"><stop stop-color="#168261"/><stop offset="1" stop-color="#074332"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#cdf32b" stop-opacity=".55"/><stop offset="1" stop-color="#cdf32b" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".5"/></filter>
  </defs>
  <rect width="800" height="550" fill="url(#bg)"/>
  <circle cx="400" cy="290" r="270" fill="url(#glow)" opacity=".28"/>
  <g filter="url(#shadow)">
    <rect x="72" y="105" width="656" height="340" rx="35" fill="#56331d" stroke="#1a1512" stroke-width="14"/>
    <rect x="96" y="129" width="608" height="292" rx="18" fill="url(#felt)" stroke="#102a21" stroke-width="7"/>
    <g fill="#030605">
      <circle cx="103" cy="136" r="16"/><circle cx="400" cy="134" r="14"/><circle cx="697" cy="136" r="16"/>
      <circle cx="103" cy="414" r="16"/><circle cx="400" cy="416" r="14"/><circle cx="697" cy="414" r="16"/>
    </g>
  </g>
  <path d="M-30 275H285" stroke="#c79455" stroke-width="13" stroke-linecap="round"/>
  <path d="M230 275H302" stroke="#eee7d5" stroke-width="13"/>
  <circle cx="345" cy="275" r="23" fill="#f6f1db" stroke="#fff" stroke-width="4"/>
  <g stroke="#fff" stroke-opacity=".32" stroke-width="2">
    <circle cx="540" cy="275" r="21" fill="#f4ce39"/><circle cx="578" cy="253" r="21" fill="#2e79dc"/><circle cx="578" cy="297" r="21" fill="#e34b4b"/>
    <circle cx="616" cy="231" r="21" fill="#8d4dcc"/><circle cx="616" cy="275" r="21" fill="#191b20"/><circle cx="616" cy="319" r="21" fill="#ef812b"/>
    <circle cx="654" cy="209" r="21" fill="#39a86e"/><circle cx="654" cy="253" r="21" fill="#992d3b"/><circle cx="654" cy="297" r="21" fill="#e7c83f"/><circle cx="654" cy="341" r="21" fill="#347ee1"/>
  </g>
  <path d="M370 275h120" stroke="#cdf32b" stroke-width="4" stroke-dasharray="7 10" opacity=".7"/>
  <text x="72" y="67" fill="#fff" font-family="Arial,sans-serif" font-weight="900" font-size="42" letter-spacing="3">POOL <tspan fill="#cdf32b">RUSH</tspan></text>
  <text x="73" y="94" fill="#fff" fill-opacity=".48" font-family="Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="5">FAST BREAK</text>
  <g transform="translate(570 58)"><rect width="158" height="38" rx="19" fill="#cdf32b"/><text x="79" y="25" text-anchor="middle" fill="#08100b" font-family="Arial,sans-serif" font-weight="900" font-size="17">UP TO 500×</text></g>
  <text x="400" y="500" text-anchor="middle" fill="#fff" fill-opacity=".55" font-family="Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="2">CHOOSE THE SHOT · BREAK THE RACK</text>
</svg>