<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#161614"/><stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#e8ff00" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#e8ff00" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e8ff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#e8e1cc"/>
    </linearGradient>

    <!-- Sicilian suit glyphs, centred at origin -->
    <g id="g-denari">
      <circle r="8.6" fill="none" stroke="#d7a10f" stroke-width="1.6"/>
      <circle r="6.6" fill="none" stroke="#d7a10f" stroke-width="0.7" opacity="0.55"/>
      <circle cx="4.4" cy="0" r="1.35" fill="#d7a10f"/>
      <circle cx="2.2" cy="3.81" r="1.35" fill="#d7a10f"/>
      <circle cx="-2.2" cy="3.81" r="1.35" fill="#d7a10f"/>
      <circle cx="-4.4" cy="0" r="1.35" fill="#d7a10f"/>
      <circle cx="-2.2" cy="-3.81" r="1.35" fill="#d7a10f"/>
      <circle cx="2.2" cy="-3.81" r="1.35" fill="#d7a10f"/>
      <circle r="1.5" fill="#d7a10f"/>
    </g>
    <g id="g-coppe">
      <path d="M -4.6 -8.4 Q 0 -10.6 4.6 -8.4 L 4.1 -1.6 Q 0 3.4 -4.1 -1.6 Z" fill="#c3311c"/>
      <path d="M -1 3.8 h 2 v 2.4 h -2 z" fill="#c3311c"/>
      <path d="M -4.6 6.2 h 9.2 v 1.6 h -9.2 z" fill="#c3311c"/>
    </g>
    <g id="g-spade">
      <path d="M -3.2 6.2 C -6.4 1.2 -4.4 -5 0 -8.2 C 2.4 -5.2 2.2 -2 1.2 1 Z" fill="#274a8f"/>
      <path d="M -4.2 1.6 H 3.2 V 3 H -4.2 Z" fill="#274a8f"/>
      <path d="M -0.9 3 h 1.8 v 2.3 h -1.8 z" fill="#274a8f"/>
      <circle cx="0" cy="6.4" r="1.35" fill="#274a8f"/>
    </g>
    <g id="g-bastoni">
      <path d="M -1.25 -8.4 h 2.5 v 14.4 a 1.25 1.25 0 0 1 -2.5 0 Z" fill="#2f7a3a"/>
      <path d="M -2.5 -11.2 h 5 v 2.9 a 2.5 2.5 0 0 1 -5 0 Z" fill="#2f7a3a"/>
      <path d="M -1.6 -4 h 3.2 v 1.6 h -3.2 z" fill="#2f7a3a"/>
      <path d="M -1.6 1.6 h 3.2 v 1.6 h -3.2 z" fill="#2f7a3a"/>
    </g>
  </defs>

  <rect width="1280" height="880" fill="url(#bg)"/>
  <rect width="1280" height="880" fill="url(#glow)"/>
  <ellipse cx="640" cy="600" rx="380" ry="60" fill="url(#shadow)"/>

  <!-- Left card: Coppe 3 -->
  <g transform="translate(400 428) rotate(-15)">
    <rect x="-120" y="-168" width="240" height="336" rx="16" fill="url(#cardGrad)" stroke="#00000030"/>
    <rect x="-111" y="-159" width="222" height="318" rx="12" fill="none" stroke="#c3311c" stroke-opacity="0.25" stroke-width="2"/>
    <text x="-104" y="-152" font-family="ui-monospace,monospace" font-size="30" font-weight="800" fill="#c3311c">3</text>
    <use href="#g-coppe" transform="translate(-104 -138) scale(1.4)"/>
    <g transform="rotate(180)">
      <text x="-104" y="-152" font-family="ui-monospace,monospace" font-size="30" font-weight="800" fill="#c3311c">3</text>
      <use href="#g-coppe" transform="translate(-104 -138) scale(1.4)"/>
    </g>
    <use href="#g-coppe" transform="translate(0 -72) scale(1.7)"/>
    <use href="#g-coppe" transform="translate(0 0) scale(1.7)"/>
    <use href="#g-coppe" transform="translate(0 72) scale(1.7)"/>
  </g>

  <!-- Center card: Denari 7 — Settebello -->
  <g transform="translate(640 384)">
    <rect x="-124" y="-172" width="248" height="344" rx="17" fill="url(#cardGrad)" stroke="#d7a10f" stroke-width="3"/>
    <rect x="-114" y="-162" width="228" height="324" rx="12" fill="none" stroke="#d7a10f" stroke-opacity="0.3" stroke-width="2"/>
    <text x="-106" y="-154" font-family="ui-monospace,monospace" font-size="32" font-weight="800" fill="#d7a10f">7</text>
    <use href="#g-denari" transform="translate(-106 -139) scale(1.5)"/>
    <g transform="rotate(180)">
      <text x="-106" y="-154" font-family="ui-monospace,monospace" font-size="32" font-weight="800" fill="#d7a10f">7</text>
      <use href="#g-denari" transform="translate(-106 -139) scale(1.5)"/>
    </g>
    <use href="#g-denari" transform="translate(-58 -64) scale(1.6)"/>
    <use href="#g-denari" transform="translate(58 -64) scale(1.6)"/>
    <use href="#g-denari" transform="translate(-58 0) scale(1.6)"/>
    <use href="#g-denari" transform="translate(58 0) scale(1.6)"/>
    <use href="#g-denari" transform="translate(-58 64) scale(1.6)"/>
    <use href="#g-denari" transform="translate(58 64) scale(1.6)"/>
    <use href="#g-denari" transform="translate(0 0) scale(1.6)"/>
  </g>

  <!-- Right card: Bastoni Re -->
  <g transform="translate(880 428) rotate(15)">
    <rect x="-120" y="-168" width="240" height="336" rx="16" fill="url(#cardGrad)" stroke="#00000030"/>
    <rect x="-111" y="-159" width="222" height="318" rx="12" fill="none" stroke="#2f7a3a" stroke-opacity="0.3" stroke-width="2"/>
    <text x="-104" y="-152" font-family="ui-monospace,monospace" font-size="30" font-weight="800" fill="#2f7a3a">R</text>
    <use href="#g-bastoni" transform="translate(-104 -138) scale(1.4)"/>
    <g transform="rotate(180)">
      <text x="-104" y="-152" font-family="ui-monospace,monospace" font-size="30" font-weight="800" fill="#2f7a3a">R</text>
      <use href="#g-bastoni" transform="translate(-104 -138) scale(1.4)"/>
    </g>
    <rect x="-86" y="-112" width="172" height="216" rx="10" fill="none" stroke="#2f7a3a" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(0 18) scale(2.1)" fill="#2f7a3a">
      <path d="M -8 -33 L -8 -36.5 L -4 -33.5 L 0 -38.5 L 4 -33.5 L 8 -36.5 L 8 -33 Z" fill="#d7a10f"/>
      <rect x="-8.4" y="-33" width="16.8" height="2.8" rx="1.3" fill="#d7a10f"/>
      <circle cx="0" cy="-24" r="5.4"/>
      <path d="M -4.8 -20.5 Q 0 -12 4.8 -20.5 Z"/>
      <path d="M -9.5 -13.5 L 9.5 -13.5 L 12.5 21 L -12.5 21 Z"/>
      <path d="M -3 -13.5 L 3 -13.5 L 4.8 21 L -4.8 21 Z" fill="#000000" opacity="0.28"/>
      <rect x="10" y="-30" width="2.2" height="44" rx="1.1" fill="#d7a10f"/>
      <rect x="8.1" y="-18" width="6" height="1.7" rx="0.85" fill="#d7a10f"/>
      <circle cx="11.1" cy="-31" r="2" fill="#d7a10f"/>
    </g>
    <use href="#g-bastoni" transform="translate(0 128) scale(1.1)"/>
  </g>

  <rect width="1280" height="880" fill="url(#vig)"/>
</svg>
