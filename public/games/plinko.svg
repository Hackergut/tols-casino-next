<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#161826"/>
      <stop offset="1" stop-color="#0c0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff8a3d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e17" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0e17" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="limeChip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ccff00"/>
      <stop offset="1" stop-color="#e5ff5c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    
  </defs>

  <rect width="240" height="320" rx="14" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="240" y2="40"/><line x1="0" y1="80" x2="240" y2="80"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="160" x2="240" y2="160"/><line x1="0" y1="200" x2="240" y2="200"/><line x1="0" y1="240" x2="240" y2="240"/><line x1="0" y1="280" x2="240" y2="280"/>
    <line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
  </g>
  <rect width="240" height="320" rx="14" fill="url(#glow)"/>

  <g transform="translate(120 148)">
    <g transform="translate(0 -66)">
      <circle cx="-12" cy="0" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="12" cy="0" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-24" cy="24" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="0" cy="24" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="24" cy="24" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-36" cy="48" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-12" cy="48" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="12" cy="48" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="36" cy="48" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-48" cy="72" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-24" cy="72" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="0" cy="72" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="24" cy="72" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="48" cy="72" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-60" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-36" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="-12" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="12" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="36" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/><circle cx="60" cy="96" r="3.5" fill="#ffffff" opacity="0.35"/>
      <circle cx="-12" cy="-4" r="7" fill="#ccff00"/><circle cx="-12" cy="-4" r="12" fill="#ccff00" opacity="0.3" filter="url(#soft)"/>
      <rect x="-59" y="126" width="22" height="20" rx="4" fill="#1c2030" opacity="0.5"/><rect x="-35" y="126" width="22" height="20" rx="4" fill="#ff8a3d" opacity="0.9"/><rect x="-11" y="126" width="22" height="20" rx="4" fill="#ccff00" opacity="0.9"/><rect x="13" y="126" width="22" height="20" rx="4" fill="#ff8a3d" opacity="0.9"/><rect x="37" y="126" width="22" height="20" rx="4" fill="#1c2030" opacity="0.5"/>
    </g>
  </g>

  <rect width="240" height="320" rx="14" fill="url(#fade)"/>

  <!-- Brand chip -->
  <g transform="translate(14 14)">
    <rect width="86" height="20" rx="5" fill="url(#limeChip)"/>
    <text x="43" y="14" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800" fill="#0c0e17" text-anchor="middle" letter-spacing="1.2">ORIGINAL</text>
  </g>

  <!-- Title -->
  <text x="18" y="294" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">Plinko</text>
  <text x="18" y="308" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#ff8a3d" letter-spacing="2.5" opacity="0.85">PROVABLY FAIR</text>

  <rect x="0.5" y="0.5" width="239" height="319" rx="13.5" stroke="#ffffff" stroke-opacity="0.06"/>
