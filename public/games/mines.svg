<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#161826"/>
      <stop offset="1" stop-color="#0c0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffb020" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e17" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c0e17" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="limeChip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ccff00"/>
      <stop offset="1" stop-color="#e5ff5c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    
  </defs>

  <rect width="240" height="320" rx="14" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="240" y2="40"/><line x1="0" y1="80" x2="240" y2="80"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="160" x2="240" y2="160"/><line x1="0" y1="200" x2="240" y2="200"/><line x1="0" y1="240" x2="240" y2="240"/><line x1="0" y1="280" x2="240" y2="280"/>
    <line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
  </g>
  <rect width="240" height="320" rx="14" fill="url(#glow)"/>

  <g transform="translate(120 148)">
    <g transform="translate(-75 -75)">
      <rect x="0" y="0" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="52" y="0" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="104" y="0" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="0" y="52" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="52" y="52" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="104" y="52" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="0" y="104" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="52" y="104" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/><rect x="104" y="104" width="44" height="44" rx="9" fill="#1c2030" stroke="#ffffff" stroke-opacity="0.06"/>
      <!-- gem -->
      <g transform="translate(22 22)"><path d="M0 -13 L13 -3 L8 13 L-8 13 L-13 -3 Z" fill="#ccff00" opacity="0.95"/><path d="M0 -13 L0 13 M-13 -3 L13 -3" stroke="#0c0e17" stroke-width="1.5" opacity="0.4"/></g>
      <!-- bomb -->
      <g transform="translate(126 126)"><circle r="13" fill="#0a0c10" stroke="#ff5b6a" stroke-width="2.5"/><rect x="-2" y="-19" width="4" height="7" rx="2" fill="#ff5b6a"/><circle cx="6" cy="-6" r="3" fill="#ff5b6a" opacity="0.6"/></g>
    </g>
  </g>

  <rect width="240" height="320" rx="14" fill="url(#fade)"/>

  <!-- Brand chip -->
  <g transform="translate(14 14)">
    <rect width="86" height="20" rx="5" fill="url(#limeChip)"/>
    <text x="43" y="14" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="800" fill="#0c0e17" text-anchor="middle" letter-spacing="1.2">ORIGINAL</text>
  </g>

  <!-- Title -->
  <text x="18" y="294" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">Mines</text>
  <text x="18" y="308" font-family="'Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#ffb020" letter-spacing="2.5" opacity="0.85">PROVABLY FAIR</text>

  <rect x="0.5" y="0.5" width="239" height="319" rx="13.5" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>